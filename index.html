
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">

    <title>Under Maintenance | DK VISUALS</title>

    <style>
        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* =========================
           BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .background::before {
            content: "";
            position: absolute;
            width: 650px;
            height: 650px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(
                circle,
                rgba(255,255,255,0.055) 0%,
                rgba(255,255,255,0.015) 40%,
                transparent 70%
            );
        }

        .grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 80px 80px;
            mask-image: linear-gradient(
                to bottom,
                transparent,
                black 30%,
                black 70%,
                transparent
            );
        }

        /* =========================
           LAYOUT
        ========================= */

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px 7%;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo img {
            display: block;
            width: 75px;
            height: auto;
            object-fit: contain;
        }

        .header-label {
            color: #777;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
        }

        .content {
            max-width: 750px;
            animation: fadeUp 1s ease forwards;
        }

        /* STATUS */

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            margin-bottom: 35px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50px;
            background: rgba(255,255,255,0.035);
            color: #aaa;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 12px rgba(255,255,255,0.6);
            animation: pulse 2s infinite;
        }

        /* HEADING */

        h1 {
            font-size: clamp(42px, 7vw, 82px);
            line-height: 1.05;
            letter-spacing: -4px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        h1 span {
            color: #777;
        }

        .description {
            max-width: 490px;
            margin: 0 auto;
            color: #888;
            font-size: 15px;
            line-height: 1.8;
        }

        /* DECORATIVE LINE */

        .divider {
            width: 55px;
            height: 1px;
            background: rgba(255,255,255,0.35);
            margin: 35px auto;
        }

        .small-text {
            color: #666;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            color: #555;
            font-size: 11px;
            letter-spacing: 1px;
        }

        footer span:last-child {
            text-transform: uppercase;
        }

        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 12px rgba(255,255,255,0.6);
            }

            50% {
                opacity: 0.35;
                box-shadow: 0 0 3px rgba(255,255,255,0.2);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            .page {
                padding: 28px 6%;
            }

            .logo img {
                width: 125px;
            }

            .header-label {
                font-size: 9px;
                letter-spacing: 1px;
            }

            h1 {
                letter-spacing: -2px;
            }

            .description {
                font-size: 14px;
            }

            footer {
                flex-direction: column;
                text-align: center;
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="background">
        <div class="grid"></div>
    </div>

    <div class="page">

        <header>
            <a href="index.html" class="logo">
                <img src="assets/images/logo-white.png" alt="DK VISUALS">
            </a>

            <div class="header-label" data-i18n="header">
                Digital Experiences
            </div>
        </header>

        <main>
            <div class="content">

                <div class="status">
                    <span class="status-dot"></span>
                    <span data-i18n="status">
                        Website under maintenance
                    </span>
                </div>

                <h1>
                    <span data-i18n="heading1">We're working</span><br>
                    <span data-i18n="heading2">on something.</span>
                </h1>

                <p class="description" data-i18n="description">
                    We're currently making improvements to our website
                    to bring you a better experience.
                    We'll be back online shortly.
                </p>

                <div class="divider"></div>

                <p class="small-text" data-i18n="patience">
                    Thank you for your patience
                </p>

            </div>
        </main>

        <footer>
            <span>© 2026 DK VISUALS</span>
            <span>Design. Develop. Deliver.</span>
        </footer>

    </div>

    <script>
        /* =========================
           LANGUAGE DETECTION
        ========================= */

        const translations = {

            en: {
                header: "Digital Experiences",
                status: "Website under maintenance",
                heading1: "We're working",
                heading2: "on something.",
                description: "We're currently making improvements to our website to bring you a better experience. We'll be back online shortly.",
                patience: "Thank you for your patience"
            },

            nl: {
                header: "Digitale ervaringen",
                status: "Website in onderhoud",
                heading1: "We werken aan",
                heading2: "iets nieuws.",
                description: "We zijn momenteel bezig met verbeteringen aan onze website om je een betere ervaring te bieden. We zijn binnenkort weer online.",
                patience: "Bedankt voor je geduld"
            },

            tr: {
                header: "Dijital Deneyimler",
                status: "Web sitesi bakımda",
                heading1: "Yeni bir şey",
                heading2: "üzerinde çalışıyoruz.",
                description: "Size daha iyi bir deneyim sunmak için web sitemizde şu anda iyileştirmeler yapıyoruz. Çok yakında tekrar çevrimiçi olacağız.",
                patience: "Anlayışınız için teşekkür ederiz"
            }

        };

        function detectLanguage() {

            const browserLanguages = navigator.languages?.length
                ? navigator.languages
                : [
                    navigator.language ||
                    navigator.userLanguage ||
                    "en"
                ];

            for (const language of browserLanguages) {

                const code = language.toLowerCase().split("-")[0];

                if (translations[code]) {
                    return code;
                }

            }

            return "en";
        }

        function setLanguage(language) {

            const selectedTranslations = translations[language];

            if (!selectedTranslations) return;

            document.documentElement.lang = language;

            document.querySelectorAll("[data-i18n]").forEach(element => {

                const key = element.dataset.i18n;

                if (selectedTranslations[key]) {
                    element.textContent = selectedTranslations[key];
                }

            });

        }

        const detectedLanguage = detectLanguage();

        setLanguage(detectedLanguage);

    </script>

</body>
</html>
